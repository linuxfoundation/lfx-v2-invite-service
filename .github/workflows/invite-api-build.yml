---
name: "Invite API Build"

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: stable

      - name: Download Dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: go test ./... -v

  chart-test:
    name: Chart Render Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Uses the helm CLI preinstalled on GitHub-hosted Ubuntu runners.
      - name: Helm version
        run: helm version

      - name: Chart render tests
        run: ./scripts/helm-test.sh charts/lfx-v2-invite-service
